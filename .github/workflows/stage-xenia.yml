name: Stage XENIA package
run-name: Stage @agenttool/xenia@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable npm version to stage
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stage-xenia
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && inputs.version == '0.1.0-beta.7'
    runs-on: ubuntu-latest
    environment: npm-bootstrap
    timeout-minutes: 15
    steps:
      - name: Check out audited source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm registry
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify source and packed consumers
        run: |
          npm run verify:surface-profile
          npm test
          npm run verify:xenia-package
          npm run verify:surface-package
          npm audit --audit-level=high
          npm audit signatures

      - name: Verify the beta channel is caught up
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          versions_json="$(npm view @agenttool/xenia versions --json --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          tags_json="$(npm view @agenttool/xenia dist-tags --json --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          VERSIONS_JSON="$versions_json" TAGS_JSON="$tags_json" node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_VERSION;
          const expectedMatch = /^(\d+\.\d+\.\d+)-beta\.(0|[1-9]\d*)$/.exec(expected);
          if (expectedMatch === null) {
            throw new Error(`expected an exact beta version, got ${expected}`);
          }

          const parsedVersions = JSON.parse(process.env.VERSIONS_JSON);
          const versions = Array.isArray(parsedVersions)
            ? parsedVersions
            : [parsedVersions];
          const tags = JSON.parse(process.env.TAGS_JSON);
          const releaseLine = expectedMatch[1];
          const expectedSerial = BigInt(expectedMatch[2]);
          const publishedBetas = versions.flatMap((version) => {
            if (typeof version !== "string") return [];
            const match = /^(\d+\.\d+\.\d+)-beta\.(0|[1-9]\d*)$/.exec(version);
            return match?.[1] === releaseLine
              ? [{ version, serial: BigInt(match[2]) }]
              : [];
          });

          if (publishedBetas.some(({ version }) => version === expected)) {
            throw new Error(`${expected} is already published`);
          }

          publishedBetas.sort((left, right) =>
            left.serial < right.serial ? -1 : left.serial > right.serial ? 1 : 0,
          );
          const highestPublishedBeta = publishedBetas.at(-1);
          if (highestPublishedBeta !== undefined && tags.beta !== highestPublishedBeta.version) {
            throw new Error(
              `beta must point to the highest published beta ${highestPublishedBeta.version} before staging ${expected}; got ${tags.beta ?? "<missing>"}`,
            );
          }

          if (expectedSerial === 0n) {
            if (highestPublishedBeta !== undefined || tags.beta !== undefined) {
              throw new Error(`cannot start ${releaseLine}-beta.0 while a beta release or tag already exists`);
            }
          } else {
            const predecessor = `${releaseLine}-beta.${expectedSerial - 1n}`;
            if (!publishedBetas.some(({ version }) => version === predecessor)) {
              throw new Error(`immediate predecessor ${predecessor} must be public before staging ${expected}`);
            }
            if (highestPublishedBeta?.version !== predecessor) {
              throw new Error(
                `immediate predecessor ${predecessor} must also be the highest published beta before staging ${expected}`,
              );
            }
          }

          console.log(`beta channel is caught up before staging ${expected}`);
          NODE

      - name: Verify exact tagged release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          if (packageJson.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`expected ${process.env.EXPECTED_VERSION}, got ${packageJson.version}`);
          }
          NODE
          expected_tag="npm-xenia-v${EXPECTED_VERSION}"
          test "$(git cat-file -t "$expected_tag")" = tag
          tagged_commit="$(git rev-list -n 1 "$expected_tag")"
          test "$tagged_commit" = "$GITHUB_SHA"
          npm run verify:covenant-release
          if npm view "@agenttool/xenia@${EXPECTED_VERSION}" version >/dev/null 2>&1; then
            echo "@agenttool/xenia@${EXPECTED_VERSION} is already published" >&2
            exit 1
          fi

      - name: Verify published Covenant source bytes
        run: npm run verify:covenant-remote

      - name: Stage the beta with provenance
        run: npm stage publish . --access public --tag beta --provenance
