name: Verify XENIA npm release
run-name: Verify @agenttool/xenia@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable npm version to verify after staged approval
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-xenia-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.version == '0.1.0-beta.7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact annotated release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: npm-xenia-v${{ inputs.version }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact tagged source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          if (packageJson.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`expected ${process.env.EXPECTED_VERSION}, got ${packageJson.version}`);
          }
          NODE
          expected_tag="npm-xenia-v${EXPECTED_VERSION}"
          test "$(git cat-file -t "$expected_tag")" = tag
          tagged_commit="$(git rev-list -n 1 "$expected_tag")"
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tagged_commit" origin/main
          echo "TAGGED_COMMIT=$tagged_commit" >> "$GITHUB_ENV"
          npm run verify:covenant-release
          npm run verify:covenant-remote

      - name: Rebuild and compare the exact public tarball
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          source_dir="$RUNNER_TEMP/xenia-source"
          registry_dir="$RUNNER_TEMP/xenia-registry"
          mkdir -p "$source_dir" "$registry_dir"
          npm pack . --json --pack-destination "$source_dir" >/dev/null
          npm pack "@agenttool/xenia@${EXPECTED_VERSION}" --ignore-scripts --json \
            --pack-destination "$registry_dir" \
            --registry=https://registry.npmjs.org \
            --userconfig=/dev/null >/dev/null
          source_tar="$(find "$source_dir" -type f -name '*.tgz' -print -quit)"
          registry_tar="$(find "$registry_dir" -type f -name '*.tgz' -print -quit)"
          test -n "$source_tar"
          test -n "$registry_tar"
          # gzip encoder output can vary across Node/zlib patch versions even
          # when the deterministic npm tar payload is byte-identical.
          cmp --silent <(gzip -cd "$source_tar") <(gzip -cd "$registry_tar")
          expected_integrity="$(npm view "@agenttool/xenia@${EXPECTED_VERSION}" dist.integrity --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          REGISTRY_TAR="$registry_tar" EXPECTED_INTEGRITY="$expected_integrity" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const actual = `sha512-${createHash("sha512")
            .update(await readFile(process.env.REGISTRY_TAR))
            .digest("base64")}`;
          if (actual !== process.env.EXPECTED_INTEGRITY) {
            throw new Error("downloaded tarball does not match public dist.integrity");
          }
          console.log(`registry integrity: ${actual}`);
          NODE

      - name: Verify public metadata and beta channel
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(npm view "@agenttool/xenia@${EXPECTED_VERSION}" version --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          git_head="$(npm view "@agenttool/xenia@${EXPECTED_VERSION}" gitHead --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          tags_json="$(npm view @agenttool/xenia dist-tags --json --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          signatures_json="$(npm view "@agenttool/xenia@${EXPECTED_VERSION}" dist.signatures --json --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          attestations_json="$(npm view "@agenttool/xenia@${EXPECTED_VERSION}" dist.attestations --json --registry=https://registry.npmjs.org --userconfig=/dev/null)"
          VERSION="$version" GIT_HEAD="$git_head" TAGS_JSON="$tags_json" \
            SIGNATURES_JSON="$signatures_json" ATTESTATIONS_JSON="$attestations_json" \
            node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_VERSION;
          const tags = JSON.parse(process.env.TAGS_JSON);
          const signatures = JSON.parse(process.env.SIGNATURES_JSON);
          const attestations = JSON.parse(process.env.ATTESTATIONS_JSON);

          if (process.env.VERSION !== expected) {
            throw new Error(`expected public version ${expected}, got ${process.env.VERSION}`);
          }
          if (process.env.GIT_HEAD !== process.env.TAGGED_COMMIT) {
            throw new Error(`registry gitHead does not match the annotated tag commit`);
          }
          if (tags.beta !== expected) {
            throw new Error(`expected beta to point to ${expected}, got ${tags.beta ?? "<missing>"}`);
          }
          if (typeof tags.latest !== "string" || tags.latest.length === 0) {
            throw new Error("npm registry did not return its required latest tag");
          }
          if (
            !Array.isArray(signatures)
            || signatures.length === 0
            || signatures.some(({ keyid, sig }) =>
              typeof keyid !== "string" || keyid.length === 0
              || typeof sig !== "string" || sig.length === 0
            )
          ) {
            throw new Error("registry metadata did not contain a complete npm signature");
          }
          if (
            typeof attestations !== "object"
            || attestations === null
            || typeof attestations.url !== "string"
            || attestations.provenance?.predicateType !== "https://slsa.dev/provenance/v1"
          ) {
            throw new Error("registry metadata did not contain the expected SLSA provenance reference");
          }

          console.log(`verified ${expected}; beta=${tags.beta}; latest=${tags.latest}`);
          NODE

      - name: Audit the installed public package signature
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          consumer_dir="$RUNNER_TEMP/xenia-consumer"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init --yes >/dev/null
          npm install "@agenttool/xenia@${EXPECTED_VERSION}" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org --userconfig=/dev/null
          npm audit signatures --registry=https://registry.npmjs.org --userconfig=/dev/null
